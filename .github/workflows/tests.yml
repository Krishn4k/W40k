# À chaque push et pull request : style (Pint), analyse statique (Larastan) et tests sur MySQL.
name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: w40k_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: root

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, pdo_mysql, zip
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Dépendances PHP
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Dépendances JS et assets (les vues de test les référencent)
        run: |
          npm ci
          npm run build

      - name: Configuration
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Style (Pint)
        run: vendor/bin/pint --test

      - name: Analyse statique (Larastan)
        run: composer analyse -- --no-progress

      - name: Tests
        run: php artisan test
