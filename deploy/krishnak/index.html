<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Krishnak — Projets</title>
    <meta name="description" content="Projets personnels de Krishnak.">
    <style>
        /* Police de titre copiée à côté de cette page par deploy/build.ps1 (aucun appel externe). */
        @font-face {
            font-family: 'Oswald';
            font-weight: 600;
            font-display: swap;
            src: url('fonts/oswald-600.woff2') format('woff2');
        }

        :root {
            --bg: #fafafa;
            --text: #18181b;
            --muted: #52525b;
            --card: #ffffff;
            --border: #e4e4e7;
            --accent: #0d9488;
            --accent-strong: #0f766e;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #09090b;
                --text: #f4f4f5;
                --muted: #a1a1aa;
                --card: #18181b;
                --border: #27272a;
                --accent: #2dd4bf;
                --accent-strong: #5eead4;
            }
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
            line-height: 1.5;
            border-top: 3px solid var(--accent);
        }

        main {
            max-width: 56rem;
            margin: 0 auto;
            padding: 4rem 1rem;
        }

        h1, h2 {
            font-family: 'Oswald', ui-sans-serif, system-ui, sans-serif;
            font-weight: 600;
            letter-spacing: 0.02em;
            margin: 0;
        }

        h1 {
            font-size: clamp(2.25rem, 6vw, 3.25rem);
            text-transform: uppercase;
        }

        .intro {
            margin: 0.5rem 0 2.5rem;
            color: var(--muted);
        }

        .projects {
            display: grid;
            gap: 1rem;
            grid-template-columns: repeat(auto-fill, minmax(16rem, 1fr));
            padding: 0;
            margin: 0;
            list-style: none;
        }

        .project {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            height: 100%;
            padding: 1.25rem;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            background: var(--card);
            color: inherit;
            text-decoration: none;
            transition: border-color 0.15s, transform 0.15s;
        }

        .project:hover,
        .project:focus-visible {
            border-color: var(--accent);
            transform: translateY(-2px);
            outline: none;
        }

        .project h2 {
            font-size: 1.375rem;
            text-transform: uppercase;
        }

        .project p {
            margin: 0;
            flex: 1;
            color: var(--muted);
            font-size: 0.9375rem;
        }

        .project .open {
            color: var(--accent-strong);
            font-weight: 600;
            font-size: 0.875rem;
        }
    </style>
</head>
<body>
    <main>
        <h1>Krishnak</h1>
        <p class="intro">Projets personnels.</p>

        <ul class="projects">
            <li>
                <a class="project" href="/w40k/">
                    <h2>W40k Collection</h2>
                    <p>Gestion de collection et de listes d'armée Warhammer 40 000 : peinture, points officiels, parties.</p>
                    <span class="open">Ouvrir →</span>
                </a>
            </li>
        </ul>
    </main>
</body>
</html>
